<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#047857"/>
      <stop offset="100%" style="stop-color:#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M100 8 L185 40 L185 110 Q185 185 100 228 Q15 185 15 110 L15 40 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>

  <!-- Inner Shield Border -->
  <path d="M100 18 L175 47 L175 107 Q175 177 100 218 Q25 177 25 107 L25 47 Z"
        fill="url(#innerGrad)" stroke="#a7f3d0" stroke-width="1" opacity="0.9"/>

  <!-- Decorative inner line -->
  <path d="M100 28 L165 54 L165 104 Q165 169 100 208 Q35 169 35 104 L35 54 Z"
        fill="none" stroke="#a7f3d0" stroke-width="0.5" opacity="0.3"/>

  <!-- Golden Star -->
  <polygon points="100,42 110,68 138,68 116,84 124,110 100,94 76,110 84,84 62,68 90,68"
           fill="url(#goldGrad)"/>

  <!-- Decorative Arcs (rice paddy motif) -->
  <path d="M50 125 Q65 108 80 125 Q95 108 100 125" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M100 125 Q105 108 120 125 Q135 108 150 125" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <path d="M55 140 Q70 125 85 140 Q100 125 115 140 Q130 125 145 140" fill="none" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Horizontal divider -->
  <line x1="55" y1="155" x2="145" y2="155" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">KABUPATEN</text>
  <text x="100" y="195" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">ACEH UTARA</text>

  <!-- Small decorative element below text -->
  <path d="M80 203 Q90 198 100 203 Q110 198 120 203" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
</svg>
